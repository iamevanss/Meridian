  <circle cx="32" cy="32" r="14" stroke="rgba(255,255,255,0.20)" stroke-width="1.3"/>
  <path d="M32 18 C 25 23, 25 41, 32 46" stroke="url(#arc2)" stroke-width="2.3" stroke-linecap="round" filter="url(#glow2)"/>
