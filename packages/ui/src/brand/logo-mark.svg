<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#212a37"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7c2ff"/>
      <stop offset="100%" stop-color="#3e7bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="18" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- globe -->
  <circle cx="32" cy="32" r="16" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/>
  <ellipse cx="32" cy="32" rx="6.4" ry="16" stroke="rgba(255,255,255,0.14)" stroke-width="1.1"/>
  <line x1="16" y1="32" x2="48" y2="32" stroke="rgba(255,255,255,0.14)" stroke-width="1.1"/>

  <!-- the meridian line: the signature arc, glass-glowing -->
  <path d="M32 16 C 24 22, 24 42, 32 48" stroke="url(#arc)" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="32" cy="16" r="2.4" fill="#a7c2ff" filter="url(#glow)"/>
  <circle cx="32" cy="48" r="2.4" fill="#3e7bfa" filter="url(#glow)"/>
</svg>
