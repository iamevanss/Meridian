name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meridian_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meridian_test
      JWT_SECRET: ci-test-secret
      ADMIN_JWT_SECRET: ci-test-admin-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run build -w apps/web
      - run: npm run build -w apps/admin
      - run: npm run build -w packages/api

  # Vercel deployment (apps/web and apps/admin) happens automatically via
  # Vercel's own GitHub integration once each project's Root Directory is
  # set — see README "Deployment" section. No extra CI step needed for that.
  
